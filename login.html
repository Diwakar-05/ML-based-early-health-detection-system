<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><title>Log in - EarlyCare AI</title></head>
<body>
<nav class="navbar navbar-expand-lg sticky-top"><div class="container">
  <a class="brand-mark navbar-brand" href="index.html"><i class="bi bi-heart-pulse-fill"></i> EarlyCare AI</a>
  <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Toggle menu"><span class="navbar-toggler-icon"></span></button>
  <div class="collapse navbar-collapse" id="nav">
    <ul class="navbar-nav ms-auto align-items-lg-center">
      <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="predict.html">Check my risk</a></li>
      <li class="nav-item"><a class="nav-link" href="index.html#how">How it works</a></li>
      <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
      <li class="nav-item"><button class="btn btn-sm nav-link" onclick="toggleTheme()" aria-label="Toggle dark mode"><i class="bi bi-circle-half"></i></button></li>
    </ul>
    <ul class="navbar-nav align-items-lg-center" id="navAuth"></ul>
  </div></div></nav>
<main class="auth-wrap"><div class="auth-card">
  <h1 class="h3 mb-1">Welcome back</h1>
  <p class="mb-4">Log in to see your saved reports.</p>
  <form id="loginForm" novalidate>
    <div class="mb-3"><label class="form-label" for="email">Email</label>
      <input type="email" id="email" class="form-control" autocomplete="email" placeholder="you@example.com">
      <div class="invalid-feedback"></div></div>
    <div class="mb-3"><label class="form-label" for="password">Password</label>
      <div class="input-group"><input type="password" id="password" class="form-control" autocomplete="current-password">
        <button type="button" class="btn btn-outline-secondary" data-toggle-pw="#password" aria-label="Show password"><i class="bi bi-eye"></i></button></div>
      <div class="invalid-feedback d-block"></div></div>
    <button class="btn btn-brand w-100" id="submitBtn" type="submit">Log in</button>
  </form>
  <p class="text-center mt-3 mb-0">New here? <a href="register.html">Create an account</a></p>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script><script src="js/utils.js"></script><script src="js/auth.js"></script><script src="js/api.js"></script>
<script src="js/login.js"></script>
</body></html>
